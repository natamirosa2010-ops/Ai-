name: apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать архив
        run: |
          ZIP=$(find . -iname "Luxor_Mobile*.zip" | head -n1)
          echo "Архив: $ZIP"
          test -n "$ZIP"
          unzip -q "$ZIP" -d src_unpacked
          ls -R src_unpacked | head -n 20

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Установить Qt
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.8.2 linux_gcc_64 -O $HOME/Qt
          aqt install-qt linux android 6.8.2 android_arm64_v8a -O $HOME/Qt

      - run: sudo apt-get install -y ninja-build

      - name: Собрать APK
        run: |
          CML=$(grep -rl "project(LuxorMobile" --include=CMakeLists.txt src_unpacked | head -n1)
          SRC=$(dirname "$CML")
          echo "Исходники: $SRC"
          $HOME/Qt/6.8.2/android_arm64_v8a/bin/qt-cmake -S "$SRC" -B build -G Ninja \
            -DQT_HOST_PATH=$HOME/Qt/6.8.2/gcc_64 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125 \
            -DQT_ANDROID_ABIS=arm64-v8a -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target apk

      - uses: actions/upload-artifact@v4
        with:
          name: luxor-apk
          path: build/**/*.apk
