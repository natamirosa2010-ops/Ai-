name: apk

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          # Accept Android SDK licenses in CI without Broken pipe
          yes "" | sdkmanager --licenses >/dev/null 2>&1 || true

          # Install required SDK packages
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Install Qt
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m pip install --upgrade pip
          pip install aqtinstall

          aqt install-qt linux desktop 6.8.2 linux_gcc_64 -O $HOME/Qt
          aqt install-qt linux android 6.8.2 android_arm64_v8a -O $HOME/Qt

      - name: Install Ninja
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure and build APK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125"

          $HOME/Qt/6.8.2/android_arm64_v8a/bin/qt-cmake -S . -B build -G Ninja \
            -DQT_HOST_PATH=$HOME/Qt/6.8.2/gcc_64 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_BUILD_TYPE=Debug

          cmake --build build --target apk

      - uses: actions/upload-artifact@v4
        with:
          name: luxor-apk
          path: build/**/*.apk
