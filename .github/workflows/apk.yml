name: apk
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать архив
        shell: bash
        run: |
          set -euxo pipefail
          ZIP=$(find . -maxdepth 2 -iname "Luxor_Mobile*.zip" | head -n 1)
          echo "Архив: $ZIP"
          test -n "$ZIP"
          rm -rf src_unpacked
          mkdir -p src_unpacked
          unzip -q "$ZIP" -d src_unpacked
          find src_unpacked -maxdepth 4 -type f | head -n 50

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Установить нужные пакеты SDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Установить Qt
        shell: bash
        run: |
          set -euxo pipefail
          pip install aqtinstall
          aqt install-qt linux desktop 6.8.2 linux_gcc_64 -O $HOME/Qt
          aqt install-qt linux android 6.8.2 android_arm64_v8a -O $HOME/Qt

      - name: Установить ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Найти исходники проекта
        shell: bash
        run: |
          set -euxo pipefail
          CML=$(find src_unpacked -name CMakeLists.txt -print | head -n 1)
          if [ -z "$CML" ]; then
            echo "Не удалось найти CMakeLists.txt в распакованном архиве"
            find src_unpacked -maxdepth 5 -print | head -n 200
            exit 1
          fi
          SRC=$(dirname "$CML")
          echo "Исходники: $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Собрать APK
        shell: bash
        run: |
          set -euxo pipefail
          $HOME/Qt/6.8.2/android_arm64_v8a/bin/qt-cmake -S "$SRC" -B build -G Ninja \
            -DQT_HOST_PATH="$HOME/Qt/6.8.2/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target apk || cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: luxor-apk
          path: build/**/*.apk
